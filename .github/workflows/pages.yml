name: Build and publish playable game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.2
          key: godot-web-4.7.2-sha512
      - name: Install verified open-source Godot and single-thread web template
        run: bash native-godot/tools/setup.sh --web
      - name: Verify and build the separate Courtyard browser preview
        run: |
          bash native-godot/tools/check.sh
          bash native-godot/tools/build-web.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            wasm-${{ runner.os }}-
      - name: Install pinned Rust and WebAssembly target
        run: rustup show
      - name: Install matching binding generator
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Build and verify source and release
        run: npm run build
      - name: Full seeded AI simulation playtest
        run: bash scripts/playtest-ai.sh
      - name: Export only the current release and licensed assets
        run: |
          node scripts/export-site.js
          node tests/site-check.js
      - name: Playtest the exported Courtyard page before deployment
        env:
          TEST_DPR: '0.4'
        run: |
          npx playwright install --with-deps chromium
          node native-godot/tests/browser.js --exported
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: courtyard-browser-checks
          path: |
            artifacts/courtyard-browser-*/
            artifacts/godot-check-*/
            artifacts/godot-web-*/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
