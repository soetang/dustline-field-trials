name: Build and publish playable game
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'bevy/README.md'
      - 'courtyard/README.md'
      - 'courtyard/docs/**'
      - 'courtyard/engine/README.md'
      - 'scripts/serve.js'
      - 'tests/serve-check.js'
      - 'tests/check-runner.js'
      - '.github/workflows/workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.2
          key: godot-web-4.7.2-sha512
      - name: Install verified open-source Godot and single-thread web template
        run: bash courtyard/tools/setup.sh --web
      - name: Verify and build the separate Courtyard browser preview
        run: |
          bash courtyard/tools/check.sh
          bash courtyard/tools/build-web.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            bevy/target
          key: wasm-apps-${{ runner.os }}-${{ hashFiles('bevy/Cargo.lock', 'bevy/rust-toolchain.toml') }}
          restore-keys: |
            wasm-apps-${{ runner.os }}-
            wasm-${{ runner.os }}-
      - name: Migrate an older cached compiler directory
        run: |
          if [[ -d target && ! -e bevy/target ]]; then mv -- target bevy/target; fi
      - name: Install pinned Rust and WebAssembly target
        working-directory: bevy
        run: rustup show
      - name: Install matching binding generator
        working-directory: bevy
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Build and verify source and release
        run: npm run build:bevy
      - name: Full seeded AI simulation playtest
        run: bash bevy/scripts/playtest-ai.sh
      - name: Export only the current release and licensed assets
        run: |
          node tests/workspace-check.js
          node tests/serve-check.js
          node tests/check-runner.js
          node tests/browser-options.js
          node classic/tests/smoke.js
          node scripts/export-site.js
          node tests/site-check.js
      - name: Playtest the exported Courtyard page before deployment
        env:
          TEST_DPR: '0.4'
        run: |
          npx playwright install --with-deps chromium
          node courtyard/tests/browser.js --exported
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: courtyard-browser-checks
          path: |
            artifacts/courtyard-browser-*/
            artifacts/godot-check-*/
            artifacts/godot-web-*/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
