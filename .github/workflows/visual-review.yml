name: Courtyard visual review (no deployment)
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Map/wall screenshots or CPU/GPU-fixture check; not hardware FPS'
        type: choice
        default: map
        options: [map, walls, crates, cpu, gpu, engine]
permissions:
  contents: read
concurrency:
  group: courtyard-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.2
          key: godot-web-4.7.2-sha512
      - name: Prepare the verified official engine and isolated release
        run: |
          bash native-godot/tools/setup.sh --web
          bash native-godot/tools/build-web.sh
          npx playwright install --with-deps chromium
      - name: Capture staged High-quality WebGL views on the runner
        env:
          REVIEW_SCENE: ${{ inputs.scene }}
        run: |
          case "$REVIEW_SCENE" in
            map) node native-godot/tests/map-review-browser.js ;;
            walls) node native-godot/tests/map-review-browser.js --wall-review ;;
            crates) node native-godot/tests/map-review-browser.js --crate-detail ;;
            engine) node native-godot/tests/map-review-browser.js --engine-lifecycle --capture ;;
            cpu) node native-godot/tests/map-review-browser.js --gameplay-profile --profile-steady --duration=3 --warmup=3 --width=640 --height=360 ;;
            gpu)
              node native-godot/tests/map-review-browser.js --gameplay-profile --gpu-timing --duration=3 --warmup=3 --width=640 --height=360
              node native-godot/tests/map-review-browser.js --benchmark --gpu-timing --samples=12 --warmup=3 --width=640 --height=360
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-visual-review-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/map-review-browser-*/*.png
            artifacts/map-review-browser-*/*.json
            artifacts/map-review-browser-*/*.cpuprofile
            artifacts/map-review-browser-*/*.log
            artifacts/godot-web-*/*.log
