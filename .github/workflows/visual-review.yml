name: Courtyard visual review (no deployment)
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Map/wall screenshots or CPU/GPU-fixture check; not hardware FPS'
        type: choice
        default: map
        options: [map, walls, crates, operators, operator-motion, death-motion, hud, surfaces, world-visuals, cpu, gpu, reported-view, engine, depth-copy]
permissions:
  contents: read
concurrency:
  group: courtyard-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node courtyard/tests/hud-buffer-probe-check.js --with-png
      - name: Check death-review validator and prepare offline VP9 encoder
        if: inputs.scene == 'death-motion'
        run: |
          node courtyard/tests/death-review-check.js
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.7.2
          key: godot-web-4.7.2-sha512
      - name: Prepare the verified official engine and isolated release
        run: |
          bash courtyard/tools/setup.sh --web
          bash courtyard/tools/build-web.sh
          npx playwright install --with-deps chromium
      - name: Capture staged High-quality WebGL views on the runner
        env:
          REVIEW_SCENE: ${{ inputs.scene }}
        run: |
          case "$REVIEW_SCENE" in
            map) node courtyard/tests/map-review-browser.js ;;
            walls) node courtyard/tests/map-review-browser.js --wall-review ;;
            crates) node courtyard/tests/map-review-browser.js --crate-detail ;;
            hud) node courtyard/tests/map-review-browser.js --hud-review ;;
            surfaces)
              node courtyard/tests/map-review-browser.js
              node courtyard/tests/map-review-browser.js --flat-surface
              ;;
            world-visuals)
              node courtyard/tests/map-review-browser.js
              node courtyard/tests/map-review-browser.js --world-visuals
              ;;
            operators)
              node courtyard/tests/map-review-browser.js --wall-review
              node courtyard/tests/map-review-browser.js --wall-review --operator-surface
              ;;
            operator-motion)
              node courtyard/tests/map-review-browser.js --wall-review --operator-motion
              node courtyard/tests/map-review-browser.js --wall-review --operator-motion --operator-surface
              node courtyard/tests/compare-operator-reviews.js
              ;;
            death-motion) node courtyard/tests/map-review-browser.js --death-review ;;
            depth-copy)
              node courtyard/tests/depth-copy-review-check.js
              node courtyard/tests/map-review-browser.js --depth-copy-review --capture
              ;;
            engine) node courtyard/tests/map-review-browser.js --engine-lifecycle --capture ;;
            cpu) node courtyard/tests/map-review-browser.js --gameplay-profile --profile-steady --duration=3 --warmup=3 --width=640 --height=360 ;;
            reported-view)
              node courtyard/tests/reported-view-check.js
              npm run test:courtyard -- reported_view
              node courtyard/tests/map-review-browser.js --benchmark --reported-view=courtyard/tests/fixtures/reported-ct.json --profile-steady --samples=12 --warmup=3 --capture
              node courtyard/tests/map-review-browser.js --benchmark --reported-view=courtyard/tests/fixtures/reported-ct.json --gpu-timing --samples=12 --warmup=3 --capture
              ;;
            gpu)
              node courtyard/tests/map-review-browser.js --gameplay-profile --gpu-timing --duration=3 --warmup=3 --width=640 --height=360
              node courtyard/tests/map-review-browser.js --benchmark --gpu-timing --samples=12 --warmup=3 --width=640 --height=360
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: courtyard-visual-review-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/map-review-browser-*/*.png
            artifacts/map-review-browser-*/*.json
            artifacts/map-review-browser-*/*.cpuprofile
            artifacts/map-review-browser-*/*.log
            artifacts/map-review-browser-*/*.webm
            artifacts/godot-web-*/*.log
