[package]
name = "desert_strike"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dustline: Field Trials — an experimental tactical FPS"

[dependencies]
bevy = { version = "0.19.1", features = ["jpeg"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.104", features = ["Document", "Element", "Window"] }
wasm-bindgen = "0.2.127"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
