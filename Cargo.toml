[package]
name = "desert_strike"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dustline: Field Trials — an experimental tactical FPS"

[features]
# Developer-only frame pacing; excluded from normal builds and Pages releases.
offline-capture = []

[dependencies]
# The browser HUD/audio are HTML + Web Audio. Avoid bundling unused 2D/UI,
# gamepad, picking, animation and audio plugins into every Wasm download.
bevy = { version = "0.19.1", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "reflect_auto_register",
    "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf",
    "bevy_world_serialization", "bevy_mikktspace", "keyboard", "mouse", "touch",
    "jpeg", "png", "tonemapping_luts", "zstd_rust",
] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["webgl2"] }
web-sys = { version = "0.3.104", features = ["Document", "Element", "Window"] }
wasm-bindgen = "0.2.127"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Keep the text HUD and desktop window backends in the native client only.
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_ui_render", "default_font", "multi_threaded", "x11", "wayland",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
