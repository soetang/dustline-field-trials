[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.md,*.txt"
exclude_filter="tests/*,tools/*,builds/*,docs/*"
export_path="builds/windows/DustlineNative.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="../.tools/godot/4.7.2/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false

[preset.2]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.md,*.txt"
exclude_filter="tests/*,tools/*,builds/*,docs/*,web/*"
export_path="builds/web/index.html"
script_export_mode=2

[preset.2.options]
custom_template/debug=""
custom_template/release="../.tools/godot/4.7.2/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="*.md,*.txt"
exclude_filter="tests/*,tools/*,builds/*,docs/*"
export_path="builds/linux/DustlineNative.x86_64"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release="../.tools/godot/4.7.2/templates/linux_release.x86_64"
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
